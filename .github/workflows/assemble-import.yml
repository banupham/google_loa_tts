name: Assemble imported ZIP
on:
  push:
    paths:
      - '.github/workflows/assemble-import.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify
        shell: bash
        run: |
          cat .import/part*.b64 | base64 -d > google_tts_tiktok_speaker_v1.zip.new
          echo "3d9221a3632c6607b88b06ee264a96c1236c0e81d804d5868394a8b592848dec  google_tts_tiktok_speaker_v1.zip.new" | sha256sum -c -
          mv google_tts_tiktok_speaker_v1.zip.new google_tts_tiktok_speaker_v1.zip
          rm -rf .import
          rm -f .importing
      - name: Commit exact archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore exact Google TTS TikTok Speaker v1 ZIP"
          git push
