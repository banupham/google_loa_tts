name: Finalize source tree
on:
  push:
    paths:
      - '.source_parts/**'
      - '.github/workflows/finalize-source.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact source files and remove transfer artifacts
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .source_parts/app.py.gz.b64 | gzip -d > app.py
          mkdir -p web
          base64 -d .source_parts/index.html.gz.b64 | gzip -d > web/index.html
          echo '0c4a5ad8539b9e26d052d439ab8452e27ee3b25d03a0867fee34e9bf9c944dec  app.py' | sha256sum -c -
          echo 'd53fa1dfb13b8f2602712377ebb1bd8aacb6d4bf453cb9c12d7e7443c3ca1cbd  web/index.html' | sha256sum -c -
          rm -rf .source_parts .import .importing .github
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize extracted Google TTS speaker source'
          git push
