name: Assemble and extract source
on:
  push:
    paths:
      - '.import/**'
      - '.github/workflows/extract-source.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact archive, verify, extract, and clean import files
        shell: bash
        run: |
          set -euo pipefail
          cat .import/part01.b64 .import/part02.b64 .import/part03.b64 .import/part03x.b64 .import/part04.b64 > archive.b64
          base64 -d archive.b64 > google_tts_tiktok_speaker_v1.zip
          echo '3d9221a3632c6607b88b06ee264a96c1236c0e81d804d5868394a8b592848dec  google_tts_tiktok_speaker_v1.zip' | sha256sum -c -
          rm -rf _unpack
          mkdir _unpack
          unzip -q google_tts_tiktok_speaker_v1.zip -d _unpack
          cp -a _unpack/. .
          rm -rf _unpack archive.b64 google_tts_tiktok_speaker_v1.zip .import .importing .github
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Import Google TikTok TTS speaker source'
          git push
