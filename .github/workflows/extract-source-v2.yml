name: Assemble and extract source v2
on:
  push:
    paths:
      - '.github/workflows/extract-source-v2.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find correct chunk order, verify archive, extract source, clean temp files
        shell: bash
        run: |
          set -euo pipefail
          expected='3d9221a3632c6607b88b06ee264a96c1236c0e81d804d5868394a8b592848dec'
          ok=0
          for order in 'part03x.b64 part04.b64' 'part04.b64 part03x.b64'; do
            set -- $order
            cat .import/part01.b64 .import/part02.b64 .import/part03.b64 ".import/$1" ".import/$2" > archive.b64
            base64 -d archive.b64 > google_tts_tiktok_speaker_v1.zip
            got=$(sha256sum google_tts_tiktok_speaker_v1.zip | awk '{print $1}')
            echo "order=$order sha256=$got"
            if [ "$got" = "$expected" ]; then
              ok=1
              break
            fi
          done
          [ "$ok" -eq 1 ] || { echo 'No chunk order matched expected SHA-256'; exit 1; }
          rm -rf _unpack
          mkdir _unpack
          unzip -q google_tts_tiktok_speaker_v1.zip -d _unpack
          cp -a _unpack/. .
          rm -rf _unpack archive.b64 google_tts_tiktok_speaker_v1.zip .import .importing .github
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Import Google TikTok TTS speaker source'
          git push
